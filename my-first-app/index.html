<!DOCTYPE html>
<html lang="en">
<head>
  <!-- These two lines tell the browser how to read the file and how to size it on phones -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First App</title>

  <!-- ============================================================
       STYLING (CSS): this section controls how everything LOOKS.
       Colors, fonts, spacing, the "modern" feel, etc.
       ============================================================ -->
  <style>
    /* A "reset" so the page looks the same in every browser */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* The overall page: a soft gradient background, centered content */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      padding: 20px;
      color: #1f2937;
    }

    /* The white "card" that holds our content, floating in the middle */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 48px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    /* The main heading */
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #111827;
    }

    /* The welcome message under the heading */
    .welcome {
      font-size: 16px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Shared look for both buttons */
    .btn {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      border: none;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    /* A subtle lift effect when you hover over a button */
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
    }

    /* The form starts hidden; JavaScript will reveal it on click */
    .form {
      display: none;
      margin-top: 8px;
      text-align: left;
    }

    /* Each label + input group */
    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    /* Highlight the input box when it's selected */
    .field input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    /* The "thank you" area shown after submitting */
    .success {
      display: none;
      margin-top: 8px;
      text-align: left;
    }

    /* The green thank-you banner at the top of the summary */
    .success .banner {
      padding: 16px;
      background: #ecfdf5;
      color: #065f46;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Each saved detail row (label on the left, value on the right) */
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 4px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 15px;
    }

    .detail-row .detail-label {
      color: #6b7280;
      font-weight: 600;
    }

    .detail-row .detail-value {
      color: #111827;
    }

    /* A softer, secondary-style button for "Start over" */
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      margin-top: 24px;
    }

    .btn-secondary:hover {
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <!-- ============================================================
       STRUCTURE (HTML): this section is WHAT is on the page.
       ============================================================ -->
  <div class="card">
    <h1>My First App</h1>
    <p class="welcome">
      Welcome! 👋 This is the very first app you've built.
      Click the button below to get started.
    </p>

    <!-- The "Get Started" button -->
    <button class="btn" id="getStartedBtn">Get Started</button>

    <!-- The form: hidden until "Get Started" is clicked -->
    <form class="form" id="signupForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <button type="submit" class="btn">Submit</button>
    </form>

    <!-- The confirmation message: hidden until the form is submitted -->
    <div class="success" id="successMessage"></div>
  </div>

  <!-- ============================================================
       BEHAVIOR (JavaScript): this section is what the page DOES.
       ============================================================ -->
  <script>
    // Grab the pieces of the page we need to work with
    const getStartedBtn = document.getElementById("getStartedBtn");
    const signupForm = document.getElementById("signupForm");
    const successMessage = document.getElementById("successMessage");

    // The name of the "notepad entry" we'll save inside the browser
    const STORAGE_KEY = "myFirstAppUser";

    // When "Get Started" is clicked: hide the button, show the form
    getStartedBtn.addEventListener("click", function () {
      getStartedBtn.style.display = "none";
      signupForm.style.display = "block";
    });

    // When the form is submitted: save the details and show the summary
    signupForm.addEventListener("submit", function (event) {
      // Stop the browser from reloading the page (its default behavior)
      event.preventDefault();

      // Read what the user typed
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

      // Save it to the browser's built-in notepad (localStorage).
      // We bundle the two values into one text string to store them together.
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ name: name, email: email }));

      // Show the saved details back to the user
      showSummary(name, email);
    });

    // Builds and reveals the summary card with the saved details
    function showSummary(name, email) {
      getStartedBtn.style.display = "none";
      signupForm.style.display = "none";
      successMessage.style.display = "block";

      // We build the summary out of safe pieces so typed text can't break the page
      successMessage.innerHTML = "";

      const banner = document.createElement("div");
      banner.className = "banner";
      banner.textContent = "Thank you, " + name + "! You're all set. 🎉";
      successMessage.appendChild(banner);

      successMessage.appendChild(makeDetailRow("Name", name));
      successMessage.appendChild(makeDetailRow("Email", email));

      // The "Start over" button clears the notepad and resets the app
      const startOver = document.createElement("button");
      startOver.className = "btn btn-secondary";
      startOver.textContent = "Start over";
      startOver.addEventListener("click", resetApp);
      successMessage.appendChild(startOver);
    }

    // Helper that creates one "Label: value" row
    function makeDetailRow(label, value) {
      const row = document.createElement("div");
      row.className = "detail-row";

      const labelEl = document.createElement("span");
      labelEl.className = "detail-label";
      labelEl.textContent = label;

      const valueEl = document.createElement("span");
      valueEl.className = "detail-value";
      valueEl.textContent = value;

      row.appendChild(labelEl);
      row.appendChild(valueEl);
      return row;
    }

    // Wipes the saved data and returns to the very beginning
    function resetApp() {
      localStorage.removeItem(STORAGE_KEY);
      signupForm.reset();
      successMessage.style.display = "none";
      getStartedBtn.style.display = "block";
    }

    // When the page first loads: if we saved someone earlier, show them again.
    // This is what makes the app "remember you" after a refresh.
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const user = JSON.parse(saved);
      showSummary(user.name, user.email);
    }
  </script>
</body>
</html>
