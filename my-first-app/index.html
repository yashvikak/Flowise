<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First App</title>
  <style>
    /* ---------- Design tokens (colors are defined once, used everywhere) ---------- */
    :root {
      --bg: #f5f4f1;          /* warm near-white page background */
      --surface: #ffffff;      /* the card */
      --ink: #1c2536;          /* main text (deep slate) */
      --muted: #5b6472;        /* secondary text */
      --accent: #2f5fe0;       /* confident blue */
      --accent-ink: #ffffff;   /* text on the accent button */
      --accent-hover: #234ec4;
      --border: #e4e2dd;
      --field-bg: #fbfaf8;
      --ok: #12805c;           /* success green */
      --ok-bg: #e7f4ee;
      --shadow: 0 18px 50px -20px rgba(28, 37, 54, 0.30);
      --ring: rgba(47, 95, 224, 0.28);
    }

    /* Dark mode: only the color values change, nothing else */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14161c;
        --surface: #1c1f27;
        --ink: #eef1f6;
        --muted: #a3acbb;
        --accent: #6b8dff;
        --accent-ink: #0e1220;
        --accent-hover: #82a0ff;
        --border: #2b2f3a;
        --field-bg: #232732;
        --ok: #4fd0a1;
        --ok-bg: #16362c;
        --shadow: 0 18px 50px -20px rgba(0, 0, 0, 0.6);
        --ring: rgba(107, 141, 255, 0.35);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 40px 36px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .brand .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .welcome {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 16px;
    }

    /* ---------- Buttons ---------- */
    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: 16px;
      padding: 13px 22px;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-ink);
      width: 100%;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

    /* ---------- Form ---------- */
    .form {
      margin-top: 6px;
      display: grid;
      gap: 16px;
    }
    /* Hidden until "Get Started" is clicked */
    [hidden] { display: none !important; }

    .field { display: grid; gap: 7px; }
    label {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
    input {
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field-bg);
      color: var(--ink);
      width: 100%;
    }
    input::placeholder { color: var(--muted); opacity: 0.7; }
    input:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .success {
      margin-top: 4px;
      background: var(--ok-bg);
      color: var(--ok);
      border-radius: 11px;
      padding: 16px 18px;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
    }

    /* Gentle fade-in for revealed sections */
    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: fade 0.25s ease both; }
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="brand"><span class="dot"></span> My First App</span>

    <h1>My First App</h1>
    <p class="welcome">
      Welcome! This is my very first web application, built with Claude Code.
      Click the button below to get started.
    </p>

    <!-- Step 1: the Get Started button (visible at first) -->
    <button id="getStarted" class="btn" type="button">Get Started</button>

    <!-- Step 2: the form (hidden until Get Started is clicked) -->
    <form id="signupForm" class="form reveal" hidden>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Jane Doe" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="jane@example.com" required />
      </div>
      <button class="btn" type="submit">Submit</button>
    </form>

    <!-- Step 3: the success message (hidden until the form is submitted) -->
    <div id="success" class="success reveal" hidden></div>
  </main>

  <script>
    // Grab the elements we need to work with
    const getStartedBtn = document.getElementById("getStarted");
    const form = document.getElementById("signupForm");
    const success = document.getElementById("success");

    // When "Get Started" is clicked: hide the button, show the form
    getStartedBtn.addEventListener("click", () => {
      getStartedBtn.hidden = true;
      form.hidden = false;
      document.getElementById("name").focus();
    });

    // When the form is submitted: show a friendly success message
    form.addEventListener("submit", (event) => {
      event.preventDefault(); // stop the page from reloading
      const name = document.getElementById("name").value.trim();
      form.hidden = true;
      success.hidden = false;
      success.textContent = "Thanks" + (name ? ", " + name : "") + "! You're all set. 🎉";
    });
  </script>
</body>
</html>
