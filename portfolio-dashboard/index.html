<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio IQ — Intelligence Dashboard</title>

  <!-- ============================================================
       STYLING (CSS): the look and feel of the whole product.
       Everything is driven by "design tokens" (the --variables in
       :root) so colors and spacing stay consistent everywhere.
       ============================================================ -->
  <style>
    :root {
      /* Canvas & surfaces */
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e6e9ee;
      --border-strong: #d5dae2;

      /* Text */
      --text: #0f1729;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      /* Sidebar (deep slate) */
      --sidebar-bg: #0f172a;
      --sidebar-bg-2: #131c30;
      --sidebar-text: #a9b4c4;
      --sidebar-active-text: #ffffff;

      /* Accent (configurable in Settings) */
      --accent: #4f46e5;
      --accent-soft: #eef2ff;

      /* Status colors (Red / Amber / Green) */
      --green: #15803d;  --green-bg: #dcfce7;
      --amber: #b45309;  --amber-bg: #fef3c7;
      --red:   #b91c1c;  --red-bg:   #fee2e2;
      --critical: #9f1239; --critical-bg: #ffe4e6;

      /* Shadows & radii */
      --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
      --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
      --shadow-lg: 0 10px 30px rgba(16,24,40,.12);
      --radius: 12px;
      --radius-sm: 8px;

      /* Spacing rhythm */
      --pad: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Numbers line up neatly in tables and KPIs */
    .num { font-variant-numeric: tabular-nums; }

    /* ---------- App shell: sidebar + main ---------- */
    .app {
      display: grid;
      grid-template-columns: 248px 1fr;
      min-height: 100vh;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px 20px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      margin-bottom: 14px;
    }
    .brand .logo {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      display: grid; place-items: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(79,70,229,.35);
    }
    .brand .name { color: #fff; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
    .brand .tag { font-size: 11px; color: var(--text-subtle); }

    .nav-label {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
      color: #5b6a82; padding: 12px 10px 6px; font-weight: 600;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 10px; border-radius: 9px;
      color: var(--sidebar-text); cursor: pointer;
      font-size: 13.5px; font-weight: 500;
      transition: background .15s ease, color .15s ease;
      user-select: none;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
    .nav-item:hover { background: rgba(255,255,255,.05); color: #e6ebf3; }
    .nav-item.active {
      background: rgba(99,102,241,.16);
      color: var(--sidebar-active-text);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .nav-item.active svg { opacity: 1; }

    .sidebar-foot {
      margin-top: auto;
      padding: 12px 10px 4px;
      border-top: 1px solid rgba(255,255,255,.07);
      font-size: 11.5px; color: var(--text-subtle);
    }

    /* ---------- Main column ---------- */
    .main { display: flex; flex-direction: column; min-width: 0; }

    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.85);
      backdrop-filter: saturate(1.4) blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px var(--pad);
    }
    .topbar h1 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
    .topbar .subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .top-date { font-size: 12.5px; color: var(--text-muted); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      display: grid; place-items: center; font-weight: 700; font-size: 13px;
    }

    .content { padding: var(--pad); }

    /* ---------- Cards / panels ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; border-bottom: 1px solid var(--border);
    }
    .card-head h2 { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
    .card-head .hint { font-size: 12px; color: var(--text-muted); }
    .card-body { padding: 18px; }

    .section-gap { margin-top: 22px; }
    .grid { display: grid; gap: 18px; }

    /* ---------- KPI stat tiles ---------- */
    .kpi-row {
      display: grid; gap: 16px;
      grid-template-columns: repeat(6, 1fr);
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 10px;
      transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    }
    .kpi.clickable { cursor: pointer; }
    .kpi.clickable:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--border-strong); }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; }
    .kpi-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
    .kpi-icon svg { width: 18px; height: 18px; }
    .kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .kpi-value { font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
    .kpi-sub { font-size: 11.5px; color: var(--text-subtle); }

    .i-accent { background: var(--accent-soft); color: var(--accent); }
    .i-green { background: var(--green-bg); color: var(--green); }
    .i-amber { background: var(--amber-bg); color: var(--amber); }
    .i-red { background: var(--red-bg); color: var(--red); }

    /* ---------- Badges / status ---------- */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
    .b-green { background: var(--green-bg); color: var(--green); }
    .b-green .dot { background: var(--green); }
    .b-amber { background: var(--amber-bg); color: var(--amber); }
    .b-amber .dot { background: var(--amber); }
    .b-red { background: var(--red-bg); color: var(--red); }
    .b-red .dot { background: var(--red); }
    .b-critical { background: var(--critical-bg); color: var(--critical); }
    .b-neutral { background: #eef1f5; color: var(--text-muted); }

    /* ---------- Tables ---------- */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left; font-weight: 600; color: var(--text-muted);
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
      padding: 11px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface-2); white-space: nowrap;
    }
    tbody td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr { transition: background .12s ease; }
    tbody tr.row-click { cursor: pointer; }
    tbody tr.row-click:hover { background: var(--accent-soft); }
    tbody tr:last-child td { border-bottom: none; }
    .t-strong { font-weight: 600; color: var(--text); }
    .t-right { text-align: right; }

    body.compact tbody td { padding: 8px 16px; }
    body.compact thead th { padding: 8px 16px; }
    body.compact .card-body { padding: 14px; }

    /* progress bar inside % complete */
    .progress { display: flex; align-items: center; gap: 9px; min-width: 120px; }
    .progress .track { flex: 1; height: 7px; background: #eceff3; border-radius: 999px; overflow: hidden; }
    .progress .fill { height: 100%; border-radius: 999px; background: var(--accent); }
    .progress .pct { font-size: 12px; color: var(--text-muted); width: 34px; text-align: right; }

    /* ---------- Donut (portfolio health) ---------- */
    .donut-wrap { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
    .donut {
      width: 168px; height: 168px; border-radius: 50%;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .donut .hole {
      width: 108px; height: 108px; border-radius: 50%;
      background: var(--surface); display: grid; place-items: center; text-align: center;
    }
    .donut .hole .big { font-size: 30px; font-weight: 750; }
    .donut .hole .small { font-size: 11px; color: var(--text-muted); }
    .legend { display: flex; flex-direction: column; gap: 12px; }
    .legend-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .legend-item .sw { width: 11px; height: 11px; border-radius: 3px; }
    .legend-item .lg-count { margin-left: auto; font-weight: 700; }
    .legend-item .lg-name { color: var(--text-muted); }

    /* ---------- Financial bars ---------- */
    .fin-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .fin-row:last-child { border-bottom: none; }
    .fin-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
    .fin-name { font-weight: 600; }
    .fin-figs { color: var(--text-muted); }
    .bar-group { display: flex; flex-direction: column; gap: 5px; }
    .bar { height: 9px; border-radius: 999px; background: #eceff3; position: relative; overflow: hidden; }
    .bar > span { position: absolute; left: 0; top: 0; height: 100%; border-radius: 999px; }
    .bar-budget > span { background: #c7cdf7; }
    .bar-actual > span { background: var(--accent); }
    .bar-legend { display: flex; gap: 18px; font-size: 11.5px; color: var(--text-muted); margin-bottom: 14px; }
    .bar-legend .k { display: inline-flex; align-items: center; gap: 6px; }
    .bar-legend .k i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    /* ---------- Risk / milestone lists ---------- */
    .list-item { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .list-item:last-child { border-bottom: none; }
    .risk-rank {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      display: grid; place-items: center; font-weight: 700; font-size: 12px;
      background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border);
    }
    .list-main { flex: 1; min-width: 0; }
    .list-title { font-weight: 600; font-size: 13.5px; }
    .list-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .list-right { text-align: right; flex-shrink: 0; }

    .mile-date {
      width: 52px; flex-shrink: 0; text-align: center;
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .mile-date .m { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); color: var(--text-muted); padding: 2px 0; }
    .mile-date .d { font-size: 17px; font-weight: 700; padding: 3px 0; }

    /* ---------- Toolbar (search + filters) ---------- */
    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .search {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 9px; padding: 8px 12px; min-width: 260px;
    }
    .search input { border: none; outline: none; font-size: 13.5px; width: 100%; background: none; color: var(--text); }
    .search svg { width: 16px; height: 16px; color: var(--text-subtle); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted);
      cursor: pointer; transition: all .12s ease;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ---------- Project cards (Projects view) ---------- */
    .proj-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .proj-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow-sm); cursor: pointer;
      transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    }
    .proj-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--border-strong); }
    .proj-card .pc-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; margin-bottom: 12px; }
    .proj-card .pc-name { font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; }
    .proj-card .pc-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .pc-figs { display: flex; justify-content: space-between; margin-top: 14px; font-size: 12.5px; }
    .pc-figs .lab { color: var(--text-subtle); font-size: 11px; }
    .pc-figs .val { font-weight: 650; }

    /* ---------- Modal / drawer ---------- */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      display: none; align-items: stretch; justify-content: flex-end; z-index: 100;
    }
    .overlay.open { display: flex; }
    .drawer {
      width: 460px; max-width: 92vw; background: var(--surface);
      height: 100%; overflow-y: auto; box-shadow: var(--shadow-lg);
      animation: slideIn .22s ease;
    }
    @keyframes slideIn { from { transform: translateX(30px); opacity: .6; } to { transform: translateX(0); opacity: 1; } }
    .drawer-head { padding: 20px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
    .drawer-head .x { float: right; cursor: pointer; color: var(--text-subtle); font-size: 22px; line-height: 1; border: none; background: none; }
    .drawer-body { padding: 22px; }
    .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin: 4px 0 20px; }
    .dl .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-subtle); }
    .dl .v { font-size: 14px; font-weight: 600; margin-top: 3px; }
    .drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin: 20px 0 10px; }

    /* ---------- Settings ---------- */
    .set-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .set-row:last-child { border-bottom: none; }
    .set-label { font-weight: 600; font-size: 13.5px; }
    .set-desc { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; max-width: 420px; }
    .set-input { padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 8px; font-size: 13.5px; min-width: 220px; color: var(--text); background: var(--surface); }
    .swatches { display: flex; gap: 10px; }
    .swatch { width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--surface) inset; }
    .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
    .seg button { border: none; background: var(--surface); padding: 8px 16px; font-size: 13px; cursor: pointer; color: var(--text-muted); font-weight: 600; }
    .seg button.active { background: var(--accent); color: #fff; }

    /* ---------- Report cards ---------- */
    .report-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
    .report-card .rc-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 12px; }
    .report-card h3 { font-size: 14.5px; font-weight: 650; }
    .report-card p { font-size: 12.5px; color: var(--text-muted); margin: 5px 0 14px; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px; justify-content: center;
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
      cursor: pointer; transition: all .12s ease;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.07); color: #fff; }
    .btn svg { width: 15px; height: 15px; }

    /* ---------- Iteration 2 additions ---------- */
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .section-head h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    .bu-group { margin-bottom: 16px; }
    .bu-title { font-weight: 650; font-size: 14.5px; }
    .bu-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .health-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .health-chips .badge { font-size: 11.5px; padding: 3px 9px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 4px 0 18px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-subtle); margin-bottom: 5px; }
    .form-grid input, .form-grid select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border-strong);
      border-radius: 8px; font-size: 13.5px; color: var(--text); background: var(--surface); outline: none;
    }
    .form-grid input:focus, .form-grid select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .form-err { color: var(--red); font-size: 12.5px; margin: 0 0 12px; display: none; }

    .task-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .task-row:last-child { border-bottom: none; }
    .task-name { font-size: 13px; font-weight: 500; }
    .task-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    .muted { color: var(--text-muted); }
    .flex { display: flex; }
    .between { justify-content: space-between; }
    .items-center { align-items: center; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      .kpi-row { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; flex-direction: column; }
      .nav { display: grid; grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 620px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .drawer { width: 100%; }
    }

    /* Two-column dashboard layout */
    .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 980px) { .cols-2 { grid-template-columns: 1fr; } }

    /* Printing (used by Reports) */
    @media print {
      .sidebar, .topbar, .toolbar, .no-print { display: none !important; }
      .app { grid-template-columns: 1fr; }
      .content { padding: 0; }
      .card { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- ============================ SIDEBAR ============================ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/><path d="M7 15l3-4 3 2 4-6"/>
          </svg>
        </div>
        <div>
          <div class="name">Portfolio IQ</div>
          <div class="tag">Intelligence Dashboard</div>
        </div>
      </div>

      <div class="nav-label">Menu</div>
      <nav class="nav" id="nav"><!-- nav items injected by JS --></nav>

      <div class="sidebar-foot">
        <div id="footOrg">Northwind Industries</div>
        <div style="margin-top:3px;">Portfolio PMO · FY2026</div>
      </div>
    </aside>

    <!-- ============================ MAIN ============================ -->
    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Executive Dashboard</h1>
          <div class="subtitle" id="pageSubtitle">Portfolio performance at a glance</div>
        </div>
        <div class="topbar-right">
          <div class="top-date" id="topDate"></div>
          <div class="avatar">PP</div>
        </div>
      </header>

      <main class="content" id="viewRoot"><!-- current view injected here --></main>
    </div>
  </div>

  <!-- Slide-in detail drawer (project details) -->
  <div class="overlay" id="overlay">

  function buildNav() {
    document.getElementById("nav").innerHTML = NAV.map(n =>
      '<button class="nav-item" data-view="' + n.key + '">' + n.icon + "<span>" + n.label + "</span></button>"
    ).join("");
    document.querySelectorAll(".nav-item").forEach(el =>
      el.addEventListener("click", () => navigate(el.dataset.view))
    );
  }

  function navigate(view) {
    currentView = view;
    const meta = NAV.find(n => n.key === view);
    document.getElementById("pageTitle").textContent = meta.title;
    document.getElementById("pageSubtitle").textContent = meta.subtitle;
    document.querySelectorAll(".nav-item").forEach(el =>
      el.classList.toggle("active", el.dataset.view === view)
    );
    render();
    document.querySelector(".content").scrollTop = 0;
    window.scrollTo(0, 0);
  }

     ========================================================= */

    const root = document.getElementById("viewRoot");
    const views = {
      dashboard: viewDashboard,
      portfolio: viewPortfolio,
      projects: viewProjects,
      risks: viewRisks,
      financials: viewFinancials,
      reports: viewReports,
      settings: viewSettings

    root.innerHTML = (views[currentView] || viewDashboard)();
    if (currentView === "projects") wireProjects();
    if (currentView === "settings") wireSettings();
    if (currentView === "reports") wireReports();
    wireRowClicks();
  }

  /* ---- KPI tiles ---- */
  function kpiTile(icon, iconClass, label, value, sub, clickView, clickFilter) {
    const click = clickView ? ' data-goview="' + clickView + '" data-gofilter="' + (clickFilter || "") + '"' : "";
    return '<div class="kpi ' + (clickView ? "clickable" : "") + '"' + click + '>' +
        '<div class="kpi-top"><span class="kpi-label">' + label + '</span>' +
        '<span class="kpi-icon ' + iconClass + '">' + icon + '</span></div>' +
        '<div class="kpi-value num">' + value + '</div>' +
        '<div class="kpi-sub">' + sub + '</div></div>';
  }

  function viewDashboard() {
    const s = portfolioStats();
    const spendPct = Math.round(s.actual / s.budget * 100);
    return '' +
      '<div class="kpi-row">' +
        kpiTile(ICONS.folder, "i-accent", "Total Projects", s.total, "Active initiatives", "projects", "All") +
        kpiTile(ICONS.check, "i-green", "On Track", s.onTrack, "Healthy delivery", "projects", "On Track") +
        kpiTile(ICONS.warn, "i-amber", "At Risk", s.atRisk, "Need attention", "projects", "At Risk") +
        kpiTile(ICONS.warn, "i-red", "Delayed", s.delayed, "Behind schedule", "projects", "Delayed") +
        kpiTile(ICONS.wallet, "i-accent", "Portfolio Budget", moneyC(s.budget), "Total approved", "financials", "") +
        kpiTile(ICONS.dollar, "i-accent", "Actual Spend", moneyC(s.actual), spendPct + "% of budget", "financials", "") +
      '</div>' +

      '<div class="cols-2 section-gap">' +
        healthCard() +
        financialCard(4) +
      '</div>' +

      '<div class="cols-2 section-gap">' +
        risksCard(5) +
        milestonesCard() +
      '</div>';

  /* ---- Portfolio Health donut ---- */
  function healthCard() {
    const s = portfolioStats();
    const g = s.onTrack, a = s.atRisk, r = s.delayed, total = s.total;
    const gp = g / total * 100, ap = a / total * 100;
    const gEnd = gp, aEnd = gp + ap;
    const gradient = "conic-gradient(var(--green) 0 " + gEnd + "%, var(--amber) " + gEnd + "% " + aEnd + "%, var(--red) " + aEnd + "% 100%)";
    const healthy = Math.round(g / total * 100);
    return '<div class="card"><div class="card-head"><h2>Portfolio Health</h2>' +
      '<span class="hint">RAG status</span></div><div class="card-body">' +
      '<div class="donut-wrap">' +
        '<div class="donut" style="background:' + gradient + '"><div class="hole">' +
          '<div><div class="big num">' + healthy + '%</div><div class="small">On Track</div></div>' +
        '</div></div>' +
        '<div class="legend">' +
          legendItem("var(--green)", "On Track", g, total) +
          legendItem("var(--amber)", "At Risk", a, total) +
          legendItem("var(--red)", "Delayed", r, total) +
        '</div>' +
      '</div></div></div>';
  }
  function legendItem(color, name, count, total) {
    const pct = Math.round(count / total * 100);
    return '<div class="legend-item"><span class="sw" style="background:' + color + '"></span>' +
      '<span class="lg-name">' + name + '</span>' +
      '<span class="lg-count num">' + count + ' <span class="muted" style="font-weight:500">(' + pct + '%)</span></span></div>';
  }

  /* ---- Financial overview (budget vs actual bars) ---- */
  function financialCard(limit) {
    const s = portfolioStats();
    const rows = PROJECTS.slice().sort((a, b) => b.budget - a.budget);
    const shown = limit ? rows.slice(0, limit) : rows;
    const maxB = Math.max.apply(null, PROJECTS.map(p => p.budget));
    const bars = shown.map(p => {
      const bw = p.budget / maxB * 100, aw = p.actual / maxB * 100;
      return '<div class="fin-row"><div class="fin-head">' +
        '<span class="fin-name">' + p.name + '</span>' +
        '<span class="fin-figs num">' + moneyC(p.actual) + ' / ' + moneyC(p.budget) + '</span></div>' +
        '<div class="bar-group">' +
          '<div class="bar bar-budget"><span style="width:' + bw + '%"></span></div>' +
          '<div class="bar bar-actual"><span style="width:' + aw + '%"></span></div>' +
        '</div></div>';
    }).join("");
    const hint = limit ? '<span class="hint">Top ' + limit + ' by budget</span>' : '<span class="hint">' + moneyC(s.actual) + ' of ' + moneyC(s.budget) + '</span>';
    return '<div class="card"><div class="card-head"><h2>Financial Overview</h2>' + hint + '</div>' +
      '<div class="card-body">' +
      '<div class="bar-legend"><span class="k"><i style="background:#c7cdf7"></i>Budget</span>' +
      '<span class="k"><i style="background:var(--accent)"></i>Actual Spend</span></div>' +
      bars + '</div></div>';
  }

  /* ---- Top risks ---- */
  function risksCard(limit) {
    const rows = RISKS.slice().sort((a, b) => b.score - a.score).slice(0, limit);
    const items = rows.map((r, i) =>
      '<div class="list-item"><div class="risk-rank">' + (i + 1) + '</div>' +
      '<div class="list-main"><div class="list-title">' + r.title + '</div>' +
      '<div class="list-meta">' + r.project + ' · Owner: ' + r.owner + '</div></div>' +
      '<div class="list-right">' + severityBadge(r.severity) +
      '<div class="list-meta" style="margin-top:6px">Likelihood: ' + r.likelihood + '</div></div></div>'
    ).join("");
    return '<div class="card"><div class="card-head"><h2>Top Risks</h2>' +
      '<span class="hint">Highest priority</span></div><div class="card-body" style="padding-top:4px">' + items + '</div></div>';
  }

  /* ---- Upcoming milestones ---- */
  function milestonesCard() {
    const rows = MILESTONES
      .map(m => Object.assign({}, m, { days: daysFromRef(m.date) }))
      .filter(m => m.days >= 0 && m.days <= 90)
      .sort((a, b) => a.days - b.days);
    const items = rows.map(m => {
      const d = parseDate(m.date);
      return '<div class="list-item"><div class="mile-date"><div class="m">' + MONTHS[d.getMonth()] + '</div>' +
        '<div class="d num">' + d.getDate() + '</div></div>' +
        '<div class="list-main"><div class="list-title">' + m.name + '</div>' +
        '<div class="list-meta">' + m.project + '</div></div>' +
        '<div class="list-right"><span class="badge b-neutral num">in ' + m.days + 'd</span></div></div>';
    }).join("");
    return '<div class="card"><div class="card-head"><h2>Upcoming Milestones</h2>' +
      '<span class="hint">Next 90 days</span></div><div class="card-body" style="padding-top:4px">' + items + '</div></div>';

        '<td><div class="progress"><div class="track"><div class="fill" style="width:' + p.complete + '%"></div></div>' +

        '<td class="t-right num">' + money(p.budget) + '</td><td class="t-right num">' + money(p.actual) + '</td>' +

  // All projects grouped into cards by business unit, each with a health summary
  function buGroups() {
    const map = {};
    PROJECTS.forEach(p => { (map[p.bu] = map[p.bu] || []).push(p); });
    return Object.keys(map).sort().map(bu => {
      const items = map[bu];
      const g = items.filter(p => p.status === "On Track").length;
      const a = items.filter(p => p.status === "At Risk").length;
      const r = items.filter(p => p.status === "Delayed").length;
      const budget = items.reduce((s, p) => s + p.budget, 0);
      const actual = items.reduce((s, p) => s + p.actual, 0);
      const chips = [];
      if (g) chips.push('<span class="badge b-green"><span class="dot"></span>' + g + ' On Track</span>');
      if (a) chips.push('<span class="badge b-amber"><span class="dot"></span>' + a + ' At Risk</span>');
      if (r) chips.push('<span class="badge b-red"><span class="dot"></span>' + r + ' Delayed</span>');
      return '<div class="card bu-group"><div class="card-head">' +
        '<div><div class="bu-title">' + bu + '</div>' +
        '<div class="bu-sub num">' + items.length + ' project' + (items.length > 1 ? "s" : "") +
        ' · ' + moneyC(actual) + ' of ' + moneyC(budget) + ' spent</div></div>' +
        '<div class="health-chips">' + chips.join("") + '</div></div>' +
        buTable(items) + '</div>';
    }).join("");
  }

  function viewPortfolio() {

    const q = projectSearch.trim().toLowerCase();

  function projectResults() {

  function viewRisks() {
    const rows = RISKS.slice().sort((a, b) => b.score - a.score).map((r, i) =>
      '<tr><td class="num">' + (i + 1) + '</td>' +
        '<td class="t-strong">' + r.title + '</td>' +
        '<td>' + r.project + '</td>' +
        '<td>' + r.impact + '</td>' +
        '<td>' + r.likelihood + '</td>' +
        '<td>' + severityBadge(r.severity) + '</td>' +
        '<td>' + r.owner + '</td>' +
        '<td class="muted" style="min-width:230px">' + r.mitigation + '</td>' +
        '<td><span class="badge b-neutral">' + r.status + '</span></td></tr>'
    ).join("");
    const crit = RISKS.filter(r => r.severity === "Critical").length;

    const open = RISKS.filter(r => r.status === "Open").length;
    return '<div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">' +
        kpiTile(ICONS.risks, "i-red", "Total Risks", RISKS.length, "Across portfolio") +
        kpiTile(ICONS.warn, "i-red", "Critical", crit, "Immediate action") +
        kpiTile(ICONS.warn, "i-amber", "High", high, "Close monitoring") +
        kpiTile(ICONS.clock, "i-accent", "Open", open, "Not yet mitigated") +
      '</div>' +
      '<div class="card section-gap"><div class="card-head"><h2>Portfolio Risk Register</h2>' +
      '<span class="hint">Ranked by priority</span></div>' +
      '<div class="table-wrap"><table><thead><tr><th>#</th><th>Risk</th><th>Project</th>' +
      '<th>Impact</th><th>Probability</th><th>Severity</th><th>Owner</th><th>Mitigation</th><th>Status</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function viewFinancials() {
    const budget = PROJECTS.reduce((s, p) => s + p.budget, 0);
    const forecast = PROJECTS.reduce((s, p) => s + p.forecast, 0);
    const actual = PROJECTS.reduce((s, p) => s + p.actual, 0);
    const variance = budget - forecast;            // + = under budget, - = over
    const util = Math.round(actual / budget * 100);
    const varClass = variance < 0 ? "i-red" : "i-green";
    const varText = (variance < 0 ? "-" : "+") + moneyC(Math.abs(variance));

    const rows = PROJECTS.slice().sort((a, b) => b.budget - a.budget).map(p => {
      const u = Math.round(p.actual / p.budget * 100);
      const v = p.budget - p.forecast;
      const vCls = v < 0 ? "neg" : "pos";
      return '<tr class="row-click" data-pid="' + p.id + '"><td class="t-strong">' + p.name + '</td>' +
        '<td class="t-right num">' + money(p.budget) + '</td>' +
        '<td class="t-right num">' + money(p.forecast) + '</td>' +
        '<td class="t-right num">' + money(p.actual) + '</td>' +
        '<td class="t-right num ' + vCls + '">' + (v < 0 ? "-" : "+") + money(Math.abs(v)) + '</td>' +
        '<td><div class="progress"><div class="track"><div class="fill" style="width:' + Math.min(u, 100) + '%"></div></div>' +
        '<span class="pct num">' + u + '%</span></div></td></tr>';
    }).join("");

    return '<div class="kpi-row" style="grid-template-columns:repeat(5,1fr)">' +
        kpiTile(ICONS.wallet, "i-accent", "Approved Budget", moneyC(budget), money(budget)) +
        kpiTile(ICONS.financials, "i-amber", "Forecast", moneyC(forecast), "Projected final") +
        kpiTile(ICONS.dollar, "i-accent", "Actual Spend", moneyC(actual), util + "% of budget") +
        kpiTile(ICONS.check, varClass, "Variance", varText, variance < 0 ? "Over forecast" : "Under forecast") +
        kpiTile(ICONS.clock, "i-accent", "Budget Utilization", util + "%", "Actual of approved") +
      '</div>' +
      '<div class="card section-gap"><div class="card-head"><h2>Financial Portfolio</h2>' +
        '<span class="hint">Approved vs forecast vs actual</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Project</th>' +
        '<th class="t-right">Approved Budget</th><th class="t-right">Forecast</th>' +
        '<th class="t-right">Actual Spend</th><th class="t-right">Variance</th><th>Utilization</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '<div class="section-gap">' + financialCard(null) + '</div>';
  }

        '<button data-density="compact" class="' + (settings.density === "compact" ? "active" : "") + '">Compact</button></div></div>' +

  /* =========================================================
     7) INTERACTIONS  — wiring up clicks after each render.
     ========================================================= */
  function wireRowClicks() {
    document.querySelectorAll("[data-pid]").forEach(el =>
      el.addEventListener("click", () => openProject(+el.dataset.pid))
    );
    document.querySelectorAll("[data-goview]").forEach(el =>
      el.addEventListener("click", () => {
        if (el.dataset.gofilter) projectFilter = el.dataset.gofilter;
        navigate(el.dataset.goview);
      })
    );
  }

  function refreshProjects() {
    document.getElementById("projResults").innerHTML = projectResults();
    wireRowClicks();
  }
  function wireProjects() {
    const search = document.getElementById("projSearch");
    if (search) {
      search.addEventListener("input", () => { projectSearch = search.value; refreshProjects(); });
    }
    document.querySelectorAll("[data-filter]").forEach(el =>
      el.addEventListener("click", () => {
        projectFilter = el.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(c => c.classList.toggle("active", c === el));
        refreshProjects();
      })
    );
    const addBtn = document.getElementById("addProjectBtn");
    if (addBtn) addBtn.addEventListener("click", openAddProject);
  }

  /* ---- "Add Project" form (opens in the slide-in drawer) ---- */
  function openAddProject() {
    const buOptions = uniqueBUs().map(b => '<option value="' + esc(b) + '">' + b + "</option>").join("");
    const statusOptions = ["On Track", "At Risk", "Delayed"].map(s => '<option value="' + s + '">' + s + "</option>").join("");
    const today = isoDate(REFERENCE_DATE);
    const later = isoDate(new Date(REFERENCE_DATE.getTime() + 180 * 86400000));
    document.getElementById("drawer").innerHTML =
      '<div class="drawer-head"><button class="x" id="drawerClose">&times;</button>' +
      '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-subtle)">New Project</div>' +
      '<div style="font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:4px">Add Project</div></div>' +
      '<div class="drawer-body">' +
        '<div class="form-err" id="apErr"></div>' +
        '<div class="form-grid">' +
          '<div class="full"><label>Project Name</label><input id="apName" type="text" placeholder="e.g. Payments Platform Upgrade" /></div>' +
          '<div><label>Project Manager</label><input id="apPm" type="text" placeholder="Full name" /></div>' +
          '<div><label>Business Unit</label><select id="apBu">' + buOptions + '</select></div>' +
          '<div><label>Status</label><select id="apStatus">' + statusOptions + '</select></div>' +
          '<div><label>% Complete</label><input id="apComplete" type="number" min="0" max="100" value="0" /></div>' +
          '<div><label>Budget ($)</label><input id="apBudget" type="number" min="0" placeholder="1000000" /></div>' +
          '<div><label>Actual Spend ($)</label><input id="apActual" type="number" min="0" value="0" /></div>' +
          '<div><label>Start Date</label><input id="apStart" type="date" value="' + today + '" /></div>' +
          '<div><label>Target Completion</label><input id="apTarget" type="date" value="' + later + '" /></div>' +
        '</div>' +
        '<div class="flex" style="gap:10px">' +
          '<button class="btn btn-primary" id="apSave">Add Project</button>' +
          '<button class="btn" id="apCancel">Cancel</button>' +
        '</div>' +
      '</div>';
    document.getElementById("overlay").classList.add("open");
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    document.getElementById("apCancel").addEventListener("click", closeDrawer);
    document.getElementById("apSave").addEventListener("click", submitNewProject);
  }

  function submitNewProject() {
    const get = id => document.getElementById(id).value;
    const name = get("apName").trim();
    const pm = get("apPm").trim();
    const err = document.getElementById("apErr");
    if (!name || !pm) {
      err.textContent = "Please enter at least a project name and a project manager.";
      err.style.display = "block";
      return;
    }
    const toInt = v => { const n = parseInt(String(v).replace(/[^0-9]/g, ""), 10); return isNaN(n) ? 0 : n; };
    const complete = Math.max(0, Math.min(100, toInt(get("apComplete"))));
    const budget = toInt(get("apBudget"));
    const actual = toInt(get("apActual"));
    const start = get("apStart") || isoDate(REFERENCE_DATE);
    const target = get("apTarget") || isoDate(REFERENCE_DATE);
    const id = PROJECTS.reduce((m, p) => Math.max(m, p.id), 0) + 1;
    PROJECTS.push({
      id, name, pm, bu: get("apBu"), status: get("apStatus"),
      complete, budget, forecast: budget, actual, start, target
    });
    closeDrawer();
    projectFilter = "All"; projectSearch = "";
    if (currentView === "projects") navigate("projects");
  }

  function wireSettings() {
    const org = document.getElementById("setOrg");
    if (org) org.addEventListener("input", () => { settings.org = org.value; saveSettings(settings); applySettings(); });
    document.querySelectorAll("[data-accent]").forEach(el =>
      el.addEventListener("click", () => {
        settings.accent = el.dataset.accent; saveSettings(settings); applySettings();
        document.querySelectorAll("[data-accent]").forEach(s => s.classList.toggle("active", s === el));
      })
    );
    document.querySelectorAll("[data-density]").forEach(el =>
      el.addEventListener("click", () => {
        settings.density = el.dataset.density; saveSettings(settings); applySettings();
        document.querySelectorAll("[data-density]").forEach(s => s.classList.toggle("active", s === el));
      })
    );
  }

  function wireReports() {
    document.querySelectorAll("[data-report]").forEach(el =>
      el.addEventListener("click", () => renderReportPreview(el.dataset.report))
    );
    document.querySelectorAll("[data-print]").forEach(el =>
      el.addEventListener("click", () => window.print())
    );
  }

  function renderReportPreview(key) {
    const s = portfolioStats();
    let inner = "";
    if (key === "exec") {
      inner = '<div class="cols-2">' + healthCard() + financialCard(4) + '</div>';
    } else if (key === "financial") {
      inner = viewFinancialsInner();
    } else if (key === "risk") {
      inner = risksCard(RISKS.length);
    } else if (key === "milestone") {
      inner = milestonesCard();
    } else if (key === "bu") {
      inner = buGroups();
    }
    const el = document.getElementById("reportPreview");
    el.innerHTML = '<div class="card"><div class="card-head"><h2>Report Preview</h2>' +
      '<button class="btn no-print" data-print="1">' + ICONS.print + 'Print / Export PDF</button></div>' +
      '<div class="card-body">' + inner + '</div></div>';
    el.querySelectorAll("[data-print]").forEach(b => b.addEventListener("click", () => window.print()));
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function viewFinancialsInner() {
    const rows = PROJECTS.slice().sort((a, b) => b.budget - a.budget).map(p => {
      const v = p.budget - p.forecast;
      return '<tr><td class="t-strong">' + p.name + '</td><td class="t-right num">' + money(p.budget) +
        '</td><td class="t-right num">' + money(p.forecast) + '</td><td class="t-right num">' + money(p.actual) +
        '</td><td class="t-right num ' + (v < 0 ? "neg" : "pos") + '">' + (v < 0 ? "-" : "+") + money(Math.abs(v)) + '</td></tr>';
    }).join("");
    return '<div class="table-wrap"><table><thead><tr><th>Project</th><th class="t-right">Approved</th>' +
      '<th class="t-right">Forecast</th><th class="t-right">Actual</th><th class="t-right">Variance</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ---- Project detail drawer ---- */
  function openProject(id) {
    const p = PROJECTS.find(x => x.id === id);
    if (!p) return;
    const util = Math.round(p.actual / p.budget * 100);
    const varc = p.budget - p.actual;
    const risks = RISKS.filter(r => r.project === p.name);
    const miles = MILESTONES.filter(m => m.project === p.name).map(m => Object.assign({}, m, { days: daysFromRef(m.date) }));
    const tasks = TASKS.filter(t => t.project === p.name);

    const riskHtml = risks.length ? risks.map(r =>
      '<div class="list-item" style="padding:10px 0"><div class="list-main"><div class="list-title" style="font-size:13px">' + r.title + '</div>' +
      '<div class="list-meta">Owner: ' + r.owner + ' · ' + r.impact + ' impact / ' + r.likelihood + ' probability</div></div>' +
      '<div class="list-right">' + severityBadge(r.severity) + '</div></div>'
    ).join("") : '<div class="muted" style="font-size:13px">No open risks recorded.</div>';

    const mileHtml = miles.length ? miles.map(m =>
      '<div class="list-item" style="padding:10px 0"><div class="list-main"><div class="list-title" style="font-size:13px">' + m.name + '</div>' +
      '<div class="list-meta">' + fmtDate(m.date) + '</div></div><div class="list-right"><span class="badge b-neutral num">in ' + m.days + 'd</span></div></div>'
    ).join("") : '<div class="muted" style="font-size:13px">No milestones in range.</div>';

    const taskHtml = tasks.length ? tasks.map(t =>
      '<div class="task-row"><div><div class="task-name">' + t.name + '</div>' +
      '<div class="task-meta">' + t.owner + ' · Due ' + fmtDate(t.due) + '</div></div>' + taskBadge(t.status) + '</div>'
    ).join("") : '<div class="muted" style="font-size:13px">No tasks recorded.</div>';

    document.getElementById("drawer").innerHTML =
      '<div class="drawer-head"><button class="x" id="drawerClose">&times;</button>' +
      '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-subtle)">Project Detail</div>' +
      '<div style="font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:4px">' + p.name + '</div>' +
      '<div style="margin-top:10px">' + statusBadge(p.status) + '</div></div>' +
      '<div class="drawer-body">' +
        '<div class="dl">' +
          dItem("Project Manager", p.pm) + dItem("Business Unit", p.bu) +
          dItem("Start Date", fmtDate(p.start)) + dItem("Target Completion", fmtDate(p.target)) +
          dItem("% Complete", p.complete + "%") + dItem("Budget Utilization", util + "%") +
          dItem("Budget", money(p.budget)) + dItem("Forecast", money(p.forecast)) +
          dItem("Actual Spend", money(p.actual)) + dItem("Remaining", money(varc)) +
        '</div>' +
        '<div class="progress" style="margin-bottom:6px"><div class="track"><div class="fill" style="width:' + p.complete + '%"></div></div>' +
        '<span class="pct num">' + p.complete + '%</span></div>' +
        '<h3>Milestones</h3>' + mileHtml +
        '<h3>Risks</h3>' + riskHtml +
        '<h3>Tasks</h3>' + taskHtml +
      '</div>';
    document.getElementById("overlay").classList.add("open");
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  }
  function dItem(k, v) { return '<div><div class="k">' + k + '</div><div class="v num">' + v + '</div></div>'; }
  function closeDrawer() { document.getElementById("overlay").classList.remove("open"); }

  /* =========================================================
     8) START-UP  — run once when the page loads.
     ========================================================= */
  document.getElementById("overlay").addEventListener("click", e => {
    if (e.target.id === "overlay") closeDrawer();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

  (function init() {
    const d = REFERENCE_DATE;
    document.getElementById("topDate").textContent = d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
    applySettings();
    buildNav();
    navigate("dashboard");
  })();
  </script>
</body>
</html>
